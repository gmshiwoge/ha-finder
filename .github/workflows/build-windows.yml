name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "HA-Finder-Windows-x64-portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build single-file Windows installer
        id: installer
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          $version = $versionLine.Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HA-Finder-Windows-x64
          path: |
            dist/HA-Finder-Setup.exe
            HA-Finder-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer as direct-download Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.installer.outputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "HA Finder $tag" --notes "Windows users can download HA-Finder-Setup.exe directly. The portable ZIP is also available."
          }
          gh release upload $tag "dist\HA-Finder-Setup.exe" --clobber
          gh release upload $tag "HA-Finder-Windows-x64-portable.zip" --clobber
