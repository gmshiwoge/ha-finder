name: Build signed macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-sign-and-notarize:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APP_PATH: build/macos/Build/Products/Release/HA Finder.app
      KEYCHAIN_NAME: ha-finder-signing.keychain-db

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Import Developer ID certificate
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperID.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS release
        run: flutter build macos --release

      - name: Sign and verify app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          codesign --force --deep --strict \
            --options runtime \
            --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Submit app for Apple notarization
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/HA-Finder-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/HA-Finder-notary.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Create signed and notarized ZIP
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "HA-Finder-macOS-signed-notarized.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: HA-Finder-macOS-signed-notarized
          path: HA-Finder-macOS-signed-notarized.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" 2>/dev/null || true
